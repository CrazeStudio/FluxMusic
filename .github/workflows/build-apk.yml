name: Build FluxMusic APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android project scaffold
        run: flutter create "${RUNNER_TEMP}/fluxmusic-build" --platforms=android --org=dev.crazestudio --project-name=fluxmusic --no-pub

      - name: Overlay FluxMusic source
        run: |
          cp pubspec.yaml "${RUNNER_TEMP}/fluxmusic-build/pubspec.yaml"
          rm -rf "${RUNNER_TEMP}/fluxmusic-build/lib"
          cp -R lib "${RUNNER_TEMP}/fluxmusic-build/lib"
          cp -R tool "${RUNNER_TEMP}/fluxmusic-build/tool"
          cp -R assets "${RUNNER_TEMP}/fluxmusic-build/assets"
          cd "${RUNNER_TEMP}/fluxmusic-build"
          python3 tool/patch_android.py

      - name: Generate launcher icon assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          cd "${RUNNER_TEMP}/fluxmusic-build"
          python3 tool/prepare_brand_assets.py

      - name: Resolve packages
        working-directory: ${{ runner.temp }}/fluxmusic-build
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ runner.temp }}/fluxmusic-build
        run: flutter build apk --release

      - name: Copy APK into workflow workspace
        run: cp "${RUNNER_TEMP}/fluxmusic-build/build/app/outputs/flutter-apk/app-release.apk" fluxmusic-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxmusic-android-release
          path: fluxmusic-release.apk
          if-no-files-found: error
          retention-days: 14
