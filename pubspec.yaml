name: fluxmusic
description: A polished Flutter music discovery and streaming app by CrazeStudio.
publish_to: "none"
version: 1.5.0+15

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dart_ytmusic_api: ^1.3.7
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  youtube_explode_dart:
    git:
      url: https://github.com/its-ashutosh-pathak/youtube_explode_dart.git
      ref: edad2760cc7998bcc18013dc9880c052ad32598f
  shared_preferences: ^2.5.3
  # 2.5.0 has a known Android release/R8 JNI regression.
  shared_preferences_android: 2.4.28
  permission_handler: ^12.0.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
